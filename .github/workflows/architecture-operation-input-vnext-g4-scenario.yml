name: Architecture Lab operation-input vNext G4 Scenario producer

on:
  push:
    branches:
      - architecture/operation-input-vnext-g4-scenario
  workflow_dispatch:

jobs:
  g4-scenario-producer:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout G4 producer experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout pinned OrbitFabric Core
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: b1aa95408710f697b0ee144a7b41f2376395e01f
          path: .work/orbitfabric-core

      - name: Checkout accepted G3 producer control
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/OrbitFabric-OpenOBSW-PoC
          ref: 061e4903b50d80863384903c4d9f268ea3d2ae4e
          path: .work/g3-control

      - name: Install Core, Stage 7 requirements and G4 package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.work/orbitfabric-core
          python -m pip install -r requirements-stage7.txt
          python -m pip install -e '.[dev]'

      - name: Assert installed G4 package boundary
        run: |
          python - <<'PY'
          import json
          import shutil
          from importlib.resources import files

          root = files("integration_package")
          manifest = json.loads(root.joinpath("integration_package.json").read_text(encoding="utf-8"))
          assert manifest["kind"] == "orbitfabric.integration_package"
          assert manifest["manifest_version"] == "0.2-lab"
          assert manifest["adapter"]["version"] == "0.2.0.dev2"
          assert manifest["execution"]["protocol"] == "orbitfabric.adapter_cli.vnext-lab"
          assert manifest["result_compatibility"] == {
              "result_versions": ["0.2-lab"],
              "default_result_version": "0.2-lab",
          }
          operations = {item["id"]: item for item in manifest["operations"]}
          assert set(operations) == {"project", "verification_projection"}
          assert operations["project"]["input_requirements"] == []
          assert operations["verification_projection"]["input_requirements"] == [{"role": "scenario"}]
          spacecraft = root.joinpath("resources/opensvf/stage7_10_spacecraft.yaml")
          assert spacecraft.is_file()
          assert "OrbitFabric-OpenOBSW-Stage7.10" in spacecraft.read_text(encoding="utf-8")
          assert shutil.which("orbitfabric-openobsw-opensvf")
          PY

      - name: Run Stage 7 regression and G4 unit gates
        run: |
          python -m pytest integration_package/tests -q \
            -k 'not test_integration_package_manifest_truthfully_advertises_slice2'

      - name: Export authoritative Core Integration Input Set
        run: |
          rm -rf /tmp/orbitfabric-g4
          mkdir -p /tmp/orbitfabric-g4/input
          orbitfabric export integration-input-set \
            orbitfabric_models/mission \
            --output-dir /tmp/orbitfabric-g4/input

      - name: Prove missing Scenario binding fails closed with explicit unavailable provenance
        run: |
          set +e
          orbitfabric-openobsw-opensvf run \
            --operation verification_projection \
            --input-set-manifest /tmp/orbitfabric-g4/input/integration_input_manifest.json \
            --profile "$GITHUB_WORKSPACE/projection_profiles/poc_openobsw_opensvf.yaml" \
            --output-dir /tmp/orbitfabric-g4/missing-binding
          status=$?
          set -e
          test "$status" -ne 0
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/orbitfabric-g4/missing-binding/integration_result.json').read_text(encoding='utf-8'))
          assert result['result'] == 'failed'
          assert result['operation'] == {'id': 'verification_projection'}
          assert result['diagnostics'][0]['code'] == 'OFI-OPINPUT-002'
          assert result['inputs']['operation_inputs'] == [{
              'role': 'scenario',
              'status': 'unavailable',
              'id': None,
              'sha256': None,
              'reason': result['diagnostics'][0]['message'],
          }]
          PY

      - name: Prove project rejects a Scenario binding
        run: |
          set +e
          orbitfabric-openobsw-opensvf run \
            --operation project \
            --input-set-manifest /tmp/orbitfabric-g4/input/integration_input_manifest.json \
            --profile "$GITHUB_WORKSPACE/projection_profiles/poc_openobsw_opensvf.yaml" \
            --operation-input scenario "$GITHUB_WORKSPACE/orbitfabric_models/scenarios/stage7_10_ping_verification.yaml" \
            --output-dir /tmp/orbitfabric-g4/project-with-input
          status=$?
          set -e
          test "$status" -ne 0
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/orbitfabric-g4/project-with-input/integration_result.json').read_text(encoding='utf-8'))
          assert result['result'] == 'failed'
          assert result['operation'] == {'id': 'project'}
          assert result['diagnostics'][0]['code'] == 'OFI-OPINPUT-002'
          assert result['inputs']['operation_inputs'] == []
          PY

      - name: Execute G4 verification projection with explicit Scenario binding
        run: |
          orbitfabric-openobsw-opensvf run \
            --operation verification_projection \
            --input-set-manifest /tmp/orbitfabric-g4/input/integration_input_manifest.json \
            --profile "$GITHUB_WORKSPACE/projection_profiles/poc_openobsw_opensvf.yaml" \
            --operation-input scenario "$GITHUB_WORKSPACE/orbitfabric_models/scenarios/stage7_10_ping_verification.yaml" \
            --output-dir /tmp/orbitfabric-g4/verification

      - name: Assert exact consumed Scenario provenance and projection accounting
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          workspace = Path.cwd()
          scenario = workspace / 'orbitfabric_models/scenarios/stage7_10_ping_verification.yaml'
          expected_sha = hashlib.sha256(scenario.read_bytes()).hexdigest()
          root = Path('/tmp/orbitfabric-g4/verification')
          result = json.loads((root / 'integration_result.json').read_text(encoding='utf-8'))

          assert result['kind'] == 'orbitfabric.integration_result'
          assert result['result_version'] == '0.2-lab'
          assert result['result'] == 'succeeded'
          assert result['adapter']['version'] == '0.2.0.dev2'
          assert result['operation'] == {'id': 'verification_projection'}
          assert result['inputs']['core_input_set']['status'] == 'available'
          assert result['inputs']['profile']['status'] == 'available'
          assert result['inputs']['operation_inputs'] == [{
              'role': 'scenario',
              'status': 'available',
              'id': 'stage7_10_ping_verification',
              'sha256': expected_sha,
              'reason': None,
          }]
          assert 'path' not in result['inputs']['operation_inputs'][0]

          plan_path = root / 'verification_projection/verification_projection_plan.json'
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          assert plan['status'] == 'executable_subset'
          assert plan['source']['scenario_id'] == 'stage7_10_ping_verification'
          assert plan['source']['scenario_sha256'] == expected_sha
          assert plan['accounting']['source_atoms'] == 6
          assert plan['accounting']['projected_atoms'] == 2
          assert plan['accounting']['not_projected_atoms'] == 4
          assert plan['accounting']['blocked_atoms'] == 0
          assert [item['id'] for item in plan['operations']] == [
              'op-0001', 'op-0002', 'op-0003', 'op-0004'
          ]

          materialization = json.loads(
              (root / 'verification_projection/opensvf/materialization_manifest.json').read_text(encoding='utf-8')
          )
          assert materialization['source_plan']['scenario_id'] == 'stage7_10_ping_verification'
          assert materialization['source_plan']['scenario_sha256'] == expected_sha
          assert [item['plan_operation_id'] for item in materialization['operation_trace']] == [
              'op-0001', 'op-0002', 'op-0003', 'op-0004'
          ]

          artifact_ids = {item['id'] for item in result['artifacts']}
          assert artifact_ids == {
              'verification.projection_plan',
              'verification.opensvf_materialization',
              'verification.opensvf_procedure',
              'verification.opensvf_campaign',
              'verification.opensvf_spacecraft',
          }
          for artifact in result['artifacts']:
              path = root / artifact['path']
              assert path.is_file(), artifact['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == artifact['sha256']

          accounting = result['evidence'][0]
          assert accounting['status'] == 'executable_subset'
          assert accounting['scenario_id'] == 'stage7_10_ping_verification'
          assert accounting['scenario_sha256'] == expected_sha
          assert accounting['accounting'] == plan['accounting']
          PY

      - name: Execute G4 project zero-input control
        run: |
          orbitfabric-openobsw-opensvf run \
            --operation project \
            --input-set-manifest /tmp/orbitfabric-g4/input/integration_input_manifest.json \
            --profile "$GITHUB_WORKSPACE/projection_profiles/poc_openobsw_opensvf.yaml" \
            --output-dir /tmp/orbitfabric-g4/g4-project

      - name: Execute accepted G3 project on identical IISS and Profile bytes
        env:
          INPUT_MANIFEST: /tmp/orbitfabric-g4/input/integration_input_manifest.json
          G3_OUTPUT: /tmp/orbitfabric-g4/g3-project
        run: |
          cd .work/g3-control
          PYTHONPATH="$PWD" python integration_package/adapter_cli.py run \
            --operation project \
            --input-set-manifest "$INPUT_MANIFEST" \
            --profile "$GITHUB_WORKSPACE/projection_profiles/poc_openobsw_opensvf.yaml" \
            --output-dir "$G3_OUTPUT"

      - name: Prove G4 did not change zero-input project semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/orbitfabric-g4')
          g3 = json.loads((root / 'g3-project/integration_result.json').read_text(encoding='utf-8'))
          g4 = json.loads((root / 'g4-project/integration_result.json').read_text(encoding='utf-8'))
          assert g3['result_version'] == g4['result_version'] == '0.2-lab'
          assert g3['operation'] == g4['operation'] == {'id': 'project'}
          assert g3['inputs']['operation_inputs'] == g4['inputs']['operation_inputs'] == []
          assert g3['capabilities'] == g4['capabilities']
          assert g3['mappings'] == g4['mappings']
          assert g3['resolutions'] == g4['resolutions']
          assert g3['coverage'] == g4['coverage']

          def artifacts(value):
              return [
                  {key: item[key] for key in (
                      'id', 'kind', 'status', 'path', 'sha256', 'derived_from_mappings'
                  )}
                  for item in value['artifacts']
              ]
          assert artifacts(g3) == artifacts(g4)
          PY
          diff -ru /tmp/orbitfabric-g4/g3-project/flight_software /tmp/orbitfabric-g4/g4-project/flight_software
          diff -ru /tmp/orbitfabric-g4/g3-project/obsw_srdb_contribution /tmp/orbitfabric-g4/g4-project/obsw_srdb_contribution

      - name: Retain G4 producer evidence
        uses: actions/upload-artifact@v4
        with:
          name: operation-input-vnext-g4-scenario-producer
          path: |
            /tmp/orbitfabric-g4/input
            /tmp/orbitfabric-g4/missing-binding
            /tmp/orbitfabric-g4/project-with-input
            /tmp/orbitfabric-g4/verification
            /tmp/orbitfabric-g4/g3-project
            /tmp/orbitfabric-g4/g4-project
          if-no-files-found: error
