name: Reference Adapter

on:
  push:
    branches:
      - feature/reference-adapter-validate-profile
      - feature/reference-adapter-core-handshake
      - feature/reference-adapter-resolved-projection
      - feature/reference-adapter-flight-contract
      - feature/reference-adapter-opensvf-srdb
      - feature/reference-adapter-package-run-result
      - architecture/reference-adapter-extraction-plan
  pull_request:
    paths:
      - "reference_adapter/**"
      - "orbitfabric_models/mission/**"
      - "orbitfabric_models/profiles/**"
      - "schemas/openobsw_opensvf_projection_profile_v0.schema.json"
      - ".github/workflows/reference-adapter.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install adapter and tests
        run: python -m pip install -e "reference_adapter[dev]"
      - name: Run adapter tests
        run: python -m pytest reference_adapter/tests -q

  core-handshake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PoC
        uses: actions/checkout@v4
      - name: Checkout validated OrbitFabric Core producer
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: 82c103a6dec32eeadc5acfcb01d1a9c641a54a42
          path: .deps/orbitfabric
      - name: Checkout validated OpenSVF consumer
        uses: actions/checkout@v4
        with:
          repository: lipofefeyt/opensvf
          ref: 667d3eadcb0bbd7814ac324b99946c4ed2f11f23
          path: .deps/opensvf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Core and reference adapter
        run: |
          python -m pip install -e .deps/orbitfabric
          python -m pip install -e reference_adapter
      - name: Export coherent Core Integration Input Set
        run: |
          orbitfabric export integration-input-set \
            orbitfabric_models/mission \
            --output-dir .handshake/integration_input
      - name: Validate real PoC Projection Profile
        run: |
          orbitfabric-openobsw-opensvf validate-profile \
            --input-set-manifest .handshake/integration_input/integration_input_manifest.json \
            --profile orbitfabric_models/profiles/openobsw_opensvf_poc_v0.yaml
      - name: Resolve real PoC Projection Model
        run: |
          orbitfabric-openobsw-opensvf resolve-projection \
            --input-set-manifest .handshake/integration_input/integration_input_manifest.json \
            --profile orbitfabric_models/profiles/openobsw_opensvf_poc_v0.yaml \
            --json .handshake/resolved_projection.json
      - name: Verify resolved projection continuity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('.handshake/resolved_projection.json').read_text())
          assert payload['kind'] == 'orbitfabric.openobsw_opensvf.resolved_projection'
          assert [item['binding_id'] for item in payload['projections']] == [
              'cmd.ping',
              'event.voltage_out_of_bounds',
              'hk.obc',
              'tm.obc_bus_voltage',
          ]
          telemetry = next(
              item for item in payload['projections']
              if item['binding_id'] == 'tm.obc_bus_voltage'
          )
          assert telemetry['core_semantics']['source']['unit'] == 'mV'
          assert telemetry['target']['srdb_name'] == 'eps.obc.bus_voltage_mv'
          assert telemetry['target']['c_symbol'] == 'OF_TM_OBC_BUS_VOLTAGE_MV'
          assert telemetry['target']['c_type'] == 'uint16_t'
          assert telemetry['target']['opensvf']['pus'] == {
              'apid': 0x100,
              'parameter_id': 0x4001,
              'service': 3,
              'subservice': 25,
          }
          PY
      - name: Run adapter_cli v0 project operation
        run: |
          orbitfabric-openobsw-opensvf run \
            --operation project \
            --input-set-manifest .handshake/integration_input/integration_input_manifest.json \
            --profile orbitfabric_models/profiles/openobsw_opensvf_poc_v0.yaml \
            --output-dir .handshake/result
      - name: Verify Integration Result contract continuity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.handshake/result')
          result = json.loads((root / 'integration_result.json').read_text())
          assert result['kind'] == 'orbitfabric.integration_result'
          assert result['result_version'] == '0.1-candidate'
          assert result['result'] == 'succeeded'
          assert result['integration'] == {
              'id': 'orbitfabric-openobsw-opensvf',
              'schema_version': '0.1-candidate',
          }
          assert result['operation'] == {'id': 'project'}
          assert result['capabilities'] == [
              'profile_validation',
              'projection',
              'artifact_generation',
              'traceability',
          ]
          assert result['inputs']['core_input_set']['status'] == 'available'
          assert result['inputs']['profile']['status'] == 'available'
          assert result['mission']['status'] == 'available'
          assert result['coverage']['status'] == 'complete'
          assert result['coverage']['scope']['domains'] == [
              'commands', 'events', 'packets', 'telemetry'
          ]
          assert len(result['coverage']['records']) == 4
          assert all(r['state'] == 'projected' for r in result['coverage']['records'])
          assert len(result['mappings']) == 4
          assert result['diagnostics'] == []
          assert result['evidence'] == []
          assert result['external_tools'] == []
          for artifact in result['artifacts']:
              assert artifact['status'] == 'generated'
              path = root / artifact['path']
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == artifact['sha256']
          PY
      - name: Compile Result-declared flight contract as C11
        run: |
          mkdir -p .handshake/result/smoke
          cat > .handshake/result/smoke/contract_smoke.c <<'C'
          #include "mission_contract.h"

          int main(void) {
              of_hk_obc_t hk = {0};
              hk.obc_bus_voltage_mv = 5000u;
              return (OF_TM_OBC_BUS_VOLTAGE_MV == 0x4001 &&
                      OF_CMD_PING == 0x1701 &&
                      OF_EVENT_VOLTAGE_OUT_OF_BOUNDS == 0x5001 &&
                      OF_HK_SET_OBC == 0x0001 &&
                      OF_HK_SET_OBC_COLLECTION_INTERVAL_S == 1u &&
                      hk.obc_bus_voltage_mv == 5000u) ? 0 : 1;
          }
          C
          cc -std=c11 -Wall -Wextra -Werror \
            -I .handshake/result/artifacts/flight \
            .handshake/result/smoke/contract_smoke.c \
            -o .handshake/result/smoke/contract_smoke
          .handshake/result/smoke/contract_smoke
      - name: Validate Result-declared SRDB through real OpenSVF and XTCE generation
        run: |
          python tools/validate_opensvf_srdb_xtce.py \
            --opensvf-repo .deps/opensvf \
            --srdb .handshake/result/artifacts/ground/poc_srdb.yaml \
            --output .handshake/result/smoke/opensvf.xml
      - name: Prove failed run remains machine-readable
        run: |
          cp orbitfabric_models/profiles/openobsw_opensvf_poc_v0.yaml .handshake/invalid_profile.yaml
          python - <<'PY'
          from pathlib import Path
          path = Path('.handshake/invalid_profile.yaml')
          text = path.read_text()
          path.write_text(text.replace('eps.obc.bus_voltage_mv', 'eps.missing', 1))
          PY
          set +e
          orbitfabric-openobsw-opensvf run \
            --operation project \
            --input-set-manifest .handshake/integration_input/integration_input_manifest.json \
            --profile .handshake/invalid_profile.yaml \
            --output-dir .handshake/failed_result
          status=$?
          set -e
          test "$status" -ne 0
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('.handshake/failed_result/integration_result.json').read_text())
          assert result['result'] == 'failed'
          assert result['diagnostics']
          assert result['coverage']['status'] == 'unavailable'
          assert all(a['status'] == 'not_generated' for a in result['artifacts'])
          PY
