name: Reference Adapter

on:
  push:
    branches:
      - feature/reference-adapter-validate-profile
      - feature/reference-adapter-core-handshake
      - feature/reference-adapter-resolved-projection
      - feature/reference-adapter-flight-contract
      - architecture/reference-adapter-extraction-plan
  pull_request:
    paths:
      - "reference_adapter/**"
      - "orbitfabric_models/mission/**"
      - "orbitfabric_models/profiles/**"
      - "schemas/openobsw_opensvf_projection_profile_v0.schema.json"
      - ".github/workflows/reference-adapter.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install adapter and tests
        run: python -m pip install -e "reference_adapter[dev]"
      - name: Run adapter tests
        run: python -m pytest reference_adapter/tests -q

  core-handshake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PoC
        uses: actions/checkout@v4
      - name: Checkout validated OrbitFabric Core producer
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: 82c103a6dec32eeadc5acfcb01d1a9c641a54a42
          path: .deps/orbitfabric
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Core and reference adapter
        run: |
          python -m pip install -e .deps/orbitfabric
          python -m pip install -e reference_adapter
      - name: Export coherent Core Integration Input Set
        run: |
          orbitfabric export integration-input-set \
            orbitfabric_models/mission \
            --output-dir .handshake/integration_input
      - name: Validate real PoC Projection Profile
        run: |
          orbitfabric-openobsw-opensvf validate-profile \
            --input-set-manifest .handshake/integration_input/integration_input_manifest.json \
            --profile orbitfabric_models/profiles/openobsw_opensvf_poc_v0.yaml
      - name: Resolve real PoC Projection Model
        run: |
          orbitfabric-openobsw-opensvf resolve-projection \
            --input-set-manifest .handshake/integration_input/integration_input_manifest.json \
            --profile orbitfabric_models/profiles/openobsw_opensvf_poc_v0.yaml \
            --json .handshake/resolved_projection.json
      - name: Verify resolved projection continuity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('.handshake/resolved_projection.json').read_text())
          assert payload['kind'] == 'orbitfabric.openobsw_opensvf.resolved_projection'
          assert [item['binding_id'] for item in payload['projections']] == [
              'cmd.ping',
              'event.voltage_out_of_bounds',
              'hk.obc',
              'tm.obc_bus_voltage',
          ]
          telemetry = next(
              item for item in payload['projections']
              if item['binding_id'] == 'tm.obc_bus_voltage'
          )
          assert telemetry['core_semantics']['source']['unit'] == 'mV'
          assert telemetry['target']['srdb_name'] == 'eps.obc.bus_voltage_mv'
          assert telemetry['target']['c_symbol'] == 'OF_TM_OBC_BUS_VOLTAGE_MV'
          assert telemetry['target']['c_type'] == 'uint16_t'
          assert next(
              item for item in telemetry['resolutions']
              if item['property'] == 'target.c_symbol'
          )['origin'] == 'adapter_default'
          PY
      - name: Materialize C flight contract
        run: |
          orbitfabric-openobsw-opensvf generate-flight-contract \
            --resolved-projection .handshake/resolved_projection.json \
            --output .handshake/flight/mission_contract.h
      - name: Compile generated contract as C11
        run: |
          cat > .handshake/flight/contract_smoke.c <<'C'
          #include "mission_contract.h"

          int main(void) {
              of_hk_obc_t hk = {0};
              hk.obc_bus_voltage_mv = 5000u;
              return (OF_TM_OBC_BUS_VOLTAGE_MV == 0x4001 &&
                      OF_CMD_PING == 0x1701 &&
                      OF_EVENT_VOLTAGE_OUT_OF_BOUNDS == 0x5001 &&
                      OF_HK_SET_OBC == 0x0001 &&
                      OF_HK_SET_OBC_COLLECTION_INTERVAL_S == 1u &&
                      hk.obc_bus_voltage_mv == 5000u) ? 0 : 1;
          }
          C
          cc -std=c11 -Wall -Wextra -Werror \
            -I .handshake/flight \
            .handshake/flight/contract_smoke.c \
            -o .handshake/flight/contract_smoke
          .handshake/flight/contract_smoke
