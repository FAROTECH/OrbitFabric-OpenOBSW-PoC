name: Architecture Lab operation-input binding probe

on:
  push:
    branches:
      - architecture/operation-input-binding-pressure-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental composition
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout pinned OrbitFabric Core
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: b1aa95408710f697b0ee144a7b41f2376395e01f
          path: .deps/orbitfabric

      - name: Install host-side dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .deps/orbitfabric
          python -m pip install -r requirements-stage7.txt

      - name: Export coherent Core Integration Input Set
        run: |
          python - <<'PY'
          from pathlib import Path
          from orbitfabric.export.integration_input_set import write_integration_input_set

          result = write_integration_input_set(
              Path("orbitfabric_models/mission"),
              Path(".architecture-probe/core-input"),
          )
          assert result.succeeded, (
              result.load_result,
              result.lint_result,
              result.generation_failed,
          )
          print(result.manifest_path)
          PY

      - name: Execute minimal Scenario operation-input binding probe
        run: |
          python experiments/operation_input_binding/probe.py \
            --scenario orbitfabric_models/scenarios/stage7_10_ping_verification.yaml \
            --input-set-manifest .architecture-probe/core-input/integration_input_manifest.json \
            --profile projection_profiles/poc_openobsw_opensvf.yaml \
            --spacecraft execution/opensvf/stage7_10_spacecraft.yaml \
            --output-dir .architecture-probe/result \
            > .architecture-probe/probe.stdout.json

      - name: Assert architectural probe result
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".architecture-probe/result")
          probe = json.loads((root / "operation_input_binding_probe.json").read_text())
          plan = json.loads((root / "verification_projection_plan.json").read_text())
          iiss = json.loads(
              Path(".architecture-probe/core-input/integration_input_manifest.json").read_text()
          )

          scenario = Path(
              "orbitfabric_models/scenarios/stage7_10_ping_verification.yaml"
          )
          scenario_sha = hashlib.sha256(scenario.read_bytes()).hexdigest()

          assert probe["kind"] == "orbitfabric.architecture_lab.operation_input_binding_probe"
          assert probe["probe_version"] == "0.1-experimental"
          assert probe["status"] == "passed"

          additional = probe["declaration_probe"]["additional_inputs"]
          assert additional == [
              {
                  "role": "scenario",
                  "requirement": "required",
                  "note": "working role identifier only; not a promoted contract",
              }
          ]

          assert probe["invocation_binding"]["role"] == "scenario"
          assert probe["invocation_binding"]["path_semantics"] == "local_execution_location_only"

          scenario_provenance = probe["consumed_input_provenance"]["scenario"]
          assert scenario_provenance["status"] == "available"
          assert scenario_provenance["id"] == "stage7_10_ping_verification"
          assert scenario_provenance["sha256"] == scenario_sha

          assert plan["status"] == "executable_subset"
          assert plan["accounting"]["source_atoms"] == 6
          assert plan["accounting"]["projected_atoms"] == 2
          assert plan["accounting"]["not_projected_atoms"] == 4
          assert plan["accounting"]["blocked_atoms"] == 0
          assert [item["id"] for item in plan["operations"]] == [
              "op-0001",
              "op-0002",
              "op-0003",
              "op-0004",
          ]

          assert probe["materialization"]["operation_trace"] == [
              {
                  "plan_operation_id": "op-0001",
                  "plan_operation": "pus_tc",
                  "procedure_step_index": 1,
                  "native_primitive": "ctx.tc",
              },
              {
                  "plan_operation_id": "op-0002",
                  "plan_operation": "expect_pus_tm",
                  "procedure_step_index": 2,
                  "native_primitive": "ctx.expect_tm",
              },
              {
                  "plan_operation_id": "op-0003",
                  "plan_operation": "expect_pus_tm",
                  "procedure_step_index": 3,
                  "native_primitive": "ctx.expect_tm",
              },
              {
                  "plan_operation_id": "op-0004",
                  "plan_operation": "expect_pus_tm",
                  "procedure_step_index": 4,
                  "native_primitive": "ctx.expect_tm",
              },
          ]

          roles = [surface["role"] for surface in iiss["surfaces"]]
          assert "scenario" not in roles

          assertions = probe["architectural_assertions"]
          assert assertions == {
              "scenario_interpreted_by_core_backed_projector": True,
              "scenario_added_to_mission_level_iiss": False,
              "materializer_rereads_scenario": False,
              "generic_verification_operation_vocabulary_claimed": False,
              "adapter_cli_v1_claimed": False,
              "generic_integration_result_claimed": False,
          }

          print("Operation-input binding architecture probe: PASS")
          PY

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operation-input-binding-probe
          path: .architecture-probe
