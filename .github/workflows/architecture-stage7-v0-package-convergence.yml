name: Architecture Lab Stage 7 v0 package convergence

on:
  push:
    branches:
      - architecture/stage7-v0-package-boundary-convergence
  workflow_dispatch:

jobs:
  package-and-studio-v0:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Stage 7 convergence branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout pinned OrbitFabric Core
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: b1aa95408710f697b0ee144a7b41f2376395e01f
          path: .work/orbitfabric-core

      - name: Install pinned Core, Stage 7 test requirements and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.work/orbitfabric-core
          python -m pip install -r requirements-stage7.txt
          python -m pip install -e '.[dev]'

      - name: Assert installed package resources and canonical v0 manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from importlib.resources import files
          from pathlib import Path

          import integration_package

          root = files("integration_package")
          manifest = root.joinpath("integration_package.json")
          schema = root.joinpath("schemas/profile-0.1.schema.json")
          baseline = root.joinpath(
              "resources/target_baselines/openobsw-0.7.0-obsw-srdb-0.1.0-reference.json"
          )
          assert manifest.is_file(), manifest
          assert schema.is_file(), schema
          assert baseline.is_file(), baseline

          payload = json.loads(manifest.read_text(encoding="utf-8"))
          assert payload["kind"] == "orbitfabric.integration_package"
          assert payload["manifest_version"] == "0.1-candidate"
          assert payload["execution"]["protocol"] == "orbitfabric.adapter_cli.v0"
          assert payload["execution"]["argv_prefix"] == ["orbitfabric-openobsw-opensvf"]
          assert [item["id"] for item in payload["operations"]] == ["project"]
          assert payload["result_compatibility"]["default_result_version"] == "0.1-candidate"

          digest = hashlib.sha256(schema.read_bytes()).hexdigest()
          assert digest == payload["profile_schemas"][0]["sha256"], (
              digest,
              payload["profile_schemas"][0]["sha256"],
          )

          executable = shutil.which("orbitfabric-openobsw-opensvf")
          assert executable, "installed console entry point is unavailable"
          print(f"installed package: {Path(integration_package.__file__).resolve()}")
          print(f"installed executable: {executable}")
          print(f"schema sha256: {digest}")
          PY

      - name: Run Stage 7 semantic/regression suite except obsolete manifest-envelope assertion
        run: |
          python -m pytest integration_package/tests -q \
            -k 'not test_integration_package_manifest_truthfully_advertises_slice2'

      - name: Record obsolete manifest assertion as explicit convergence debt
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('integration_package/tests/test_adapter_slice2.py').read_text(encoding='utf-8')
          assert 'package["package_version"]' in text
          assert 'package["adapter"]["protocol"]' in text
          print('Historical Stage 7 manifest test intentionally records the pre-canonical envelope.')
          print('The canonical manifest is asserted independently in this convergence workflow.')
          PY

      - name: Export coherent Core Integration Input Set
        run: |
          mkdir -p /tmp/orbitfabric-stage7/input
          orbitfabric export integration-input-set \
            orbitfabric_models/mission \
            --output-dir /tmp/orbitfabric-stage7/input

      - name: Execute installed Stage 7 package through exact adapter_cli.v0 argv
        run: |
          rm -rf /tmp/orbitfabric-stage7/direct-result
          orbitfabric-openobsw-opensvf run \
            --operation project \
            --input-set-manifest /tmp/orbitfabric-stage7/input/integration_input_manifest.json \
            --profile "$GITHUB_WORKSPACE/projection_profiles/poc_openobsw_opensvf.yaml" \
            --output-dir /tmp/orbitfabric-stage7/direct-result

      - name: Assert direct v0 Result identity and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/orbitfabric-stage7/direct-result/integration_result.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['kind'] == 'orbitfabric.integration_result'
          assert payload['result_version'] == '0.1-candidate'
          assert payload['result'] == 'succeeded'
          assert payload['integration']['id'] == 'orbitfabric-openobsw-opensvf'
          assert payload['adapter']['id'] == 'orbitfabric-openobsw-opensvf'
          assert payload['operation']['id'] == 'project'
          assert payload['inputs']['core_input_set']['status'] == 'available'
          assert payload['inputs']['profile']['status'] == 'available'
          assert payload['coverage']['status'] == 'complete'
          assert payload['artifacts']
          print(path.read_text(encoding='utf-8'))
          PY

      - name: Checkout pinned OrbitFabric Studio consumer
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric-studio
          ref: 05785a51acb726da48ebf1498d716c9a45a971c4
          path: .work/orbitfabric-studio

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Execute installed adapter through current Studio Rust v0 runner
        env:
          ORBITFABRIC_STUDIO_ADAPTER_ACCEPTANCE_EXECUTABLE: orbitfabric-openobsw-opensvf
          ORBITFABRIC_STUDIO_ADAPTER_ACCEPTANCE_INPUT_MANIFEST: /tmp/orbitfabric-stage7/input/integration_input_manifest.json
          ORBITFABRIC_STUDIO_ADAPTER_ACCEPTANCE_PROFILE: ${{ github.workspace }}/projection_profiles/poc_openobsw_opensvf.yaml
          ORBITFABRIC_STUDIO_ADAPTER_ACCEPTANCE_OUTPUT_DIR: /tmp/orbitfabric-stage7/studio-result
        run: |
          cargo test --locked \
            --manifest-path .work/orbitfabric-studio/src-tauri/Cargo.toml \
            external_adapter_acceptance_executes_through_studio_runner \
            -- --nocapture

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .work/orbitfabric-studio/package-lock.json

      - name: Install locked Studio dependencies
        working-directory: .work/orbitfabric-studio
        run: npm ci

      - name: Run current Studio generic logic regression suite
        working-directory: .work/orbitfabric-studio
        run: npm run test:logic

      - name: Compile real Studio logic modules for Stage 7 generic acceptance
        working-directory: .work/orbitfabric-studio
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.logic-tests.json
          mkdir -p .test-dist
          printf '{ "type": "commonjs" }\n' > .test-dist/package.json

      - name: Create temporary Stage 7 generic convergence acceptance
        working-directory: .work/orbitfabric-studio
        run: |
          cat > tests/studio-logic/stage7-v0-generic-convergence.test.mjs <<'JS'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { existsSync, readFileSync } from "node:fs";
          import { createRequire } from "node:module";
          import { dirname, isAbsolute, join, relative, resolve, sep } from "node:path";
          import test from "node:test";

          const require = createRequire(import.meta.url);
          const { parseIntegrationPackageManifest } = require("../../.test-dist/integrations/manifest.js");
          const {
            evaluateIntegrationCompatibility,
            parseCoreIntegrationInputManifest,
          } = require("../../.test-dist/integrations/compatibility.js");
          const {
            parseProjectionProfile,
            selectProfileSchema,
            validateProjectionProfile,
          } = require("../../.test-dist/integrations/profile.js");
          const {
            createExecutionAuthorization,
            validateAdapterRunPreflight,
          } = require("../../.test-dist/integrations/execution.js");
          const {
            parseIntegrationResult,
            validateIntegrationResult,
          } = require("../../.test-dist/integrations/result.js");
          const { assessIntegrationFreshness } = require("../../.test-dist/integrations/staleness.js");

          const packageManifestPath = requiredEnv("STAGE7_PACKAGE_MANIFEST");
          const profilePath = requiredEnv("STAGE7_PROFILE");
          const inputManifestPath = requiredEnv("STAGE7_INPUT_MANIFEST");
          const resultPath = requiredEnv("STAGE7_RESULT");

          function requiredEnv(name) {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is required for Stage 7 convergence acceptance.`);
            return value;
          }

          function sha256Bytes(bytes) {
            return createHash("sha256").update(bytes).digest("hex");
          }

          function readBytes(path) {
            return readFileSync(path);
          }

          function readText(path) {
            return readFileSync(path, "utf8");
          }

          function containedFile(root, relativePath) {
            if (!relativePath || isAbsolute(relativePath)) return false;
            const resolvedRoot = resolve(root);
            const candidate = resolve(resolvedRoot, relativePath);
            return candidate.startsWith(`${resolvedRoot}${sep}`);
          }

          function artifactChecks(result, bundleRoot) {
            return result.artifacts.map((artifact) => {
              if (artifact.status !== "generated") {
                return {
                  artifactId: artifact.id,
                  path: artifact.path,
                  exists: null,
                  sha256Matches: null,
                  contained: null,
                };
              }

              const contained = containedFile(bundleRoot, artifact.path);
              const candidate = artifact.path && contained ? join(bundleRoot, artifact.path) : null;
              const exists = candidate ? existsSync(candidate) : false;
              const sha256Matches =
                candidate && exists && artifact.sha256
                  ? sha256Bytes(readBytes(candidate)).toLowerCase() === artifact.sha256.toLowerCase()
                  : false;

              return {
                artifactId: artifact.id,
                path: artifact.path,
                exists,
                sha256Matches,
                contained,
              };
            });
          }

          function entityIndexPath(inputManifest) {
            const surface = inputManifest.surfaces.find((item) => item.role === "entity_index");
            assert.ok(surface, "Input Set must declare Entity Index surface");
            assert.equal(surface.status, "available");
            assert.ok(surface.path, "available Entity Index surface must have a path");
            return resolve(dirname(inputManifestPath), surface.path);
          }

          test("Studio generic v0 contracts consume current Stage 7 package", () => {
            const packageText = readText(packageManifestPath);
            const descriptor = parseIntegrationPackageManifest(packageManifestPath, packageText);

            assert.equal(descriptor.integrationId, "orbitfabric-openobsw-opensvf");
            assert.equal(descriptor.execution.protocol, "orbitfabric.adapter_cli.v0");
            assert.deepEqual(descriptor.operations.map((item) => item.id), ["project"]);

            const inputSet = parseCoreIntegrationInputManifest(readText(inputManifestPath));
            const compatibility = evaluateIntegrationCompatibility(descriptor, inputSet);
            assert.deepEqual(
              compatibility,
              { state: "compatible", reasons: [] },
              compatibility.reasons.map((item) => item.message).join("\n"),
            );

            const profileBytes = readBytes(profilePath);
            const profile = parseProjectionProfile(
              profilePath,
              sha256Bytes(profileBytes),
              profileBytes.toString("utf8"),
            );
            const schemaDescriptor = selectProfileSchema(descriptor, profile.identity.schemaVersion);
            const schemaPath = resolve(dirname(packageManifestPath), schemaDescriptor.path);
            const schemaBytes = readBytes(schemaPath);
            const schemaSha = sha256Bytes(schemaBytes);
            const schemaRelative = relative(dirname(packageManifestPath), schemaPath);
            const schemaRead = {
              path: schemaPath,
              text: schemaBytes.toString("utf8"),
              sha256: schemaSha,
              contained: !schemaRelative.startsWith("..") && !isAbsolute(schemaRelative),
              sha256Matches: schemaSha.toLowerCase() === schemaDescriptor.sha256.toLowerCase(),
            };
            const profileValidation = validateProjectionProfile(descriptor, schemaRead, profile);
            assert.equal(profileValidation.valid, true, profileValidation.errors.join("\n"));

            const authorization = createExecutionAuthorization(descriptor);
            const runRequest = {
              operation: "project",
              inputSetManifestPath: inputManifestPath,
              profilePath,
              outputDir: dirname(resultPath),
            };
            assert.deepEqual(validateAdapterRunPreflight(descriptor, authorization, runRequest), []);

            const resultText = readText(resultPath);
            const result = parseIntegrationResult(resultText);
            const bundle = {
              resultPath,
              resultText,
              artifactChecks: artifactChecks(result, dirname(resultPath)),
            };
            const resultValidation = validateIntegrationResult(result, bundle);
            assert.equal(
              resultValidation.usable,
              true,
              resultValidation.issues.map((item) => `${item.code}: ${item.message}`).join("\n"),
            );

            assert.equal(result.result, "succeeded");
            assert.equal(result.integration.id, descriptor.integrationId);
            assert.equal(result.adapter.id, descriptor.adapterId);
            assert.equal(result.adapter.version, descriptor.adapterVersion);
            assert.equal(result.operation.id, "project");

            const packageCapabilities = new Set(descriptor.advertisedCapabilities);
            const operation = descriptor.operations.find((item) => item.id === result.operation.id);
            assert.ok(operation);
            const operationCapabilities = new Set(operation.capabilities);
            assert.ok(result.capabilities.every((item) => packageCapabilities.has(item)));
            assert.ok(result.capabilities.every((item) => operationCapabilities.has(item)));

            assert.equal(result.coverage.status, "complete");
            const coverageStates = new Set(result.coverage.records.map((item) => item.state));
            assert.ok(coverageStates.has("projected"));
            assert.ok(coverageStates.has("not_projected"));

            const entityIndex = JSON.parse(readText(entityIndexPath(inputSet)));
            const entityKeys = new Set(
              entityIndex.entities.map((item) => `${item.domain}\u0000${item.id}`),
            );
            for (const mapping of result.mappings) {
              for (const source of mapping.sources) {
                assert.ok(
                  entityKeys.has(`${source.domain}\u0000${source.id}`),
                  `mapping ${mapping.id} source ${source.domain}/${source.id} must resolve in Core Entity Index`,
                );
              }
            }

            const profileBindingIds = new Set(
              Array.isArray(profile.value.bindings)
                ? profile.value.bindings
                    .map((item) => (item && typeof item === "object" ? item.id : null))
                    .filter((item) => typeof item === "string")
                : [],
            );
            for (const mapping of result.mappings) {
              for (const binding of mapping.profileBindings) {
                assert.ok(
                  profileBindingIds.has(binding),
                  `mapping ${mapping.id} binding ${binding} must resolve`,
                );
              }
            }

            const freshness = assessIntegrationFreshness(result, inputSet, profile);
            assert.equal(freshness.state, "fresh", freshness.reason);
          });
          JS

      - name: Consume current Stage 7 through real Studio generic v0 contracts
        working-directory: .work/orbitfabric-studio
        env:
          STAGE7_PACKAGE_MANIFEST: ${{ github.workspace }}/integration_package/integration_package.json
          STAGE7_PROFILE: ${{ github.workspace }}/projection_profiles/poc_openobsw_opensvf.yaml
          STAGE7_INPUT_MANIFEST: /tmp/orbitfabric-stage7/input/integration_input_manifest.json
          STAGE7_RESULT: /tmp/orbitfabric-stage7/studio-result/integration_result.json
        run: node --test tests/studio-logic/stage7-v0-generic-convergence.test.mjs

      - name: Retain convergence evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage7-v0-package-convergence
          if-no-files-found: error
          path: |
            /tmp/orbitfabric-stage7/input
            /tmp/orbitfabric-stage7/direct-result
            /tmp/orbitfabric-stage7/studio-result
