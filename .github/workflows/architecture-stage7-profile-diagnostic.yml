name: Architecture Lab Stage 7 Profile diagnostic

on:
  push:
    branches:
      - architecture/stage7-v0-package-boundary-convergence
  workflow_dispatch:

jobs:
  diagnose-profile-schema:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4

      - name: Checkout pinned Studio
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric-studio
          ref: 05785a51acb726da48ebf1498d716c9a45a971c4
          path: .work/orbitfabric-studio

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .work/orbitfabric-studio/package-lock.json

      - name: Install and compile Studio integration logic
        working-directory: .work/orbitfabric-studio
        run: |
          npm ci
          node node_modules/typescript/bin/tsc -p tsconfig.logic-tests.json
          mkdir -p .test-dist
          printf '{ "type": "commonjs" }\n' > .test-dist/package.json

      - name: Diagnose exact Profile/schema bytes and AJV result
        working-directory: .work/orbitfabric-studio
        env:
          STAGE7_ROOT: ${{ github.workspace }}
        run: |
          node <<'JS'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const { createRequire } = require('node:module');
          const { dirname, resolve } = require('node:path');
          const requireFromHere = createRequire(process.cwd() + '/diagnostic.cjs');
          const { parseIntegrationPackageManifest } = requireFromHere('./.test-dist/integrations/manifest.js');
          const { parseProjectionProfile, selectProfileSchema, validateProjectionProfile } = requireFromHere('./.test-dist/integrations/profile.js');

          const root = process.env.STAGE7_ROOT;
          const manifestPath = resolve(root, 'integration_package/integration_package.json');
          const profilePath = resolve(root, 'projection_profiles/poc_openobsw_opensvf.yaml');
          const manifestText = readFileSync(manifestPath, 'utf8');
          const profileText = readFileSync(profilePath, 'utf8');
          const digest = (value) => createHash('sha256').update(value).digest('hex');

          const descriptor = parseIntegrationPackageManifest(manifestPath, manifestText);
          const profile = parseProjectionProfile(profilePath, digest(profileText), profileText);
          const selected = selectProfileSchema(descriptor, profile.identity.schemaVersion);
          const schemaPath = resolve(dirname(manifestPath), selected.path);
          const schemaText = readFileSync(schemaPath, 'utf8');
          const schema = JSON.parse(schemaText);

          console.log('MANIFEST_PATH=' + manifestPath);
          console.log('PROFILE_PATH=' + profilePath);
          console.log('SCHEMA_PATH=' + schemaPath);
          console.log('PROFILE_SHA256=' + digest(profileText));
          console.log('SCHEMA_SHA256=' + digest(schemaText));
          console.log('MANIFEST_SCHEMA_SHA256=' + selected.sha256);
          console.log('PROFILE_IDENTITY=' + JSON.stringify(profile.identity));
          console.log('PROFILE_TOP_KEYS=' + JSON.stringify(Object.keys(profile.value)));
          console.log('PROFILE_TOP_TARGET=' + JSON.stringify(profile.value.target ?? null));
          console.log('PROFILE_SETTINGS=' + JSON.stringify(profile.value.settings ?? null));
          console.log('SCHEMA_ID=' + String(schema.$id));
          console.log('SCHEMA_TOP_PROPERTIES=' + JSON.stringify(Object.keys(schema.properties ?? {})));

          const platformConsts = [];
          const visit = (node, path = '#') => {
            if (Array.isArray(node)) {
              node.forEach((item, i) => visit(item, `${path}/${i}`));
              return;
            }
            if (!node || typeof node !== 'object') return;
            if (Object.prototype.hasOwnProperty.call(node, 'const')) {
              platformConsts.push({ path, const: node.const });
            }
            for (const [key, value] of Object.entries(node)) visit(value, `${path}/${key}`);
          };
          visit(schema);
          console.log('SCHEMA_CONSTS=' + JSON.stringify(platformConsts));

          const validation = validateProjectionProfile(descriptor, {
            path: schemaPath,
            text: schemaText,
            sha256: digest(schemaText),
            contained: true,
            sha256Matches: digest(schemaText).toLowerCase() === selected.sha256.toLowerCase(),
          }, profile);
          console.log('VALIDATION=' + JSON.stringify(validation));

          if (digest(schemaText).toLowerCase() !== selected.sha256.toLowerCase()) {
            throw new Error('Runtime schema digest differs from manifest digest.');
          }
          if (!validation.valid) {
            throw new Error('Runtime Profile validation failed; see diagnostic output above.');
          }
          JS
