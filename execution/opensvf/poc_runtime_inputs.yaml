runtime_input_id: poc_opensvf_bridge_readiness_inputs
stage: "6.2"
status: bridge_readiness

description: >
  PoC-side runtime readiness manifest for validating the OpenSVF pipe-mode
  bridge boundary before executing any YAMCS or TC/TM runtime campaign.

bridge_assumption:
  candidate_bridge: opensvf_pipe_mode
  custom_bridge_process: false
  rationale: >
    OpenSVF pipe mode is expected to be the bridge between the PoC runtime
    campaign layer and the OrbitFabric-enabled OpenOBSW host simulator.

opensvf:
  repository: ../opensvf
  spacecraft_config: execution/opensvf/poc_spacecraft.yaml
  transport_mode: pipe
  external_srdb_path_direct_support_assumed: false
  external_srdb_path_strategy: poc_side_runtime_input_manifest

openobsw:
  host_sim_binary: ../openobsw/build_stage4_orbitfabric/sim/obsw_sim
  expected_contract_adapter: orbitfabric_enabled

generated_artifacts:
  flight_contract:
    path: generated_artifacts/flight_software/mission_contract.h
    required_for_clean_clone_validation: true
  generated_srdb:
    path: generated_artifacts/ground_segment/poc_srdb.yaml
    required_for_clean_clone_validation: true
  generated_xtce_mdb:
    path: execution/generated/poc_xtce_mdb.xml
    required_for_clean_clone_validation: false
    generation_hint: python3 tools/generate_poc_xtce_mdb.py --opensvf-repo ../opensvf

runtime_plan:
  descriptor: execution/campaigns/poc_runtime_ping_plan.yaml
  first_command: TC(17,1)
  orbitfabric_command: OF_CMD_PING
  expected_tm_sequence:
    - TM(1,1)
    - TM(17,2)
    - TM(1,7)

stage_dependencies:
  stage6_1_discovery_descriptor: execution/campaigns/poc_opensvf_pipe_mode_discovery.yaml
  stage6_1_discovery_doc: docs/stage6_1_opensvf_pipe_mode_discovery.md
  stage6_0_runtime_discovery_descriptor: execution/campaigns/poc_runtime_discovery.yaml

current_boundary:
  yamcs_runtime_execution: false
  command_injection_runtime: false
  telemetry_runtime_observation: false
  docker_workflow: false
  ci_workflow: false
  renode_execution: false
  opensvf_proper_changes: false
  openobsw_proper_changes: false
  custom_bridge_process: false
  runtime_bridge_implementation: false
