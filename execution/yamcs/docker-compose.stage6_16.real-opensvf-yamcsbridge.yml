services:
  opensvf-yamcsbridge:
    image: python:3.12-slim
    depends_on:
      - yamcs
    network_mode: "service:yamcs"
    volumes:
      - ../../:/workspace/poc:ro
      - ../../../opensvf:/workspace/opensvf:ro
    working_dir: /workspace/poc
    command:
      - python3
      - execution/yamcs/stage6_16_opensvf_yamcsbridge_driver.py
      - --opensvf-root
      - /workspace/opensvf
      - --cycles
      - "20"
      - --delay
      - "0.25"
      - --linger
      - "12.0"
