modes:
  BOOT:
    description: Initial boot and system initialization.
    initial: true

  NOMINAL:
    description: Standard PoC operational mode.

  SAFE:
    description: Protective mode entered after critical or unsafe conditions.

mode_transitions:
  - from: BOOT
    to: NOMINAL
    reason: boot_completed
    description: Transition after successful initialization.

  - from: NOMINAL
    to: SAFE
    reason: voltage_out_of_bounds
    description: Transition after voltage telemetry leaves the accepted operating envelope.
